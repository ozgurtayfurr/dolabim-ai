<title>Dolabım AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f5f7;color:#111827}
.app{max-width:560px;margin:auto;min-height:100vh;background:#fff}.top{padding:24px 20px 14px;position:sticky;top:0;background:#fff;z-index:5;border-bottom:1px solid #eee}
h1{margin:0;font-size:27px}.sub{color:#6b7280;font-size:14px;margin-top:4px}
main{padding:18px 16px 100px}.card{border:1px solid #e5e7eb;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #00000008}
label{font-weight:650;font-size:14px;display:block;margin-bottom:7px}select,input,button{font:inherit}select,input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;background:#fff}

.combo{border:1px solid #e5e7eb;border-radius:17px;padding:14px;margin-top:12px;background:#fafafa}.combo h3{margin:0 0 10px}.item{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid #eee;font-size:14px;gap:10px}.wardrobeGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wardrobeCard{border:1px solid #e5e7eb;border-radius:16px;overflow:hidden;background:#fff}.wardrobeCard img{width:100%;height:180px;object-fit:cover;display:block}.wardrobeInfo{padding:10px}.wardrobeInfo b{display:block}.wardrobeInfo span{font-size:12px;color:#6b7280}.wardrobeInfo.noimg{padding-top:70px}.tag{font-size:12px;background:#e5e7eb;padding:4px 8px;border-radius:99px}
.lock{color:#b45309}.empty{text-align:center;color:#6b7280;padding:25px 8px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:10px 6px calc(10px + env(safe-area-inset-bottom));z-index:8}.nav{background:none;color:#6b7280;padding:7px 14px}.nav.active{color:#111827}.small{font-size:12px;color:#6b7280}.check{display:flex;gap:8px;align-items:center;margin-top:9px}.check input{width:auto}.preview{width:100%;height:180px;object-fit:cover;border-radius:14px;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="app">
<header class="top"><h1>Dolabım AI</h1><div class="sub">Dolabındaki parçalardan sana kombin önerir.</div></header>
<main>
<section id="home">
<div class="card">
<h2 style="margin-top:0">Kombinini oluştur</h2>
<div class="grid">
<div><label>Hava</label><select id="weather"><option value="normal">Ilık / normal</option><option value="cold">Soğuk</option><option value="rain">Yağmurlu</option><option value="coldrain">Soğuk + yağmur</option></select></div>
<div><label>Etkinlik</label><select id="event"><option value="daily">Günlük</option><option value="work">İş</option><option value="night">Gece</option><option value="wedding">Düğün / özel</option></select></div>
</div>
<div class="check"><input id="dress" type="checkbox"><label for="dress" style="margin:0">Özel etkinlikte elbiseleri önceliklendir</label></div>
<div class="actions"><button class="primary" onclick="makeCombos()">✨ 4–5 kombin oluştur</button><button class="secondary" onclick="resetLocks()">Sıfırla</button></div>
</div>
<div id="results"></div>
</section>

<section id="wardrobe" style="display:none">
<div class="card"><h2 style="margin-top:0">Dolabım</h2><p class="small">32 kadın kıyafeti ile deneme dolabı. Kombinlerde bu parçalardan seçim yapılır; seçilen parçalar 3 gün kilitlenir.</p>
<div id="wardrobeList"></div></div>
</section>

<section id="saved" style="display:none">
<div class="card"><h2 style="margin-top:0">Son kombinler</h2><div id="savedList"></div></div>
</section>
</main>
<nav class="bottom">
<button class="nav active" onclick="show('home',this)">✨ Kombin</button>
<button class="nav" onclick="show('wardrobe',this)">👕 Dolabım</button>
<button class="nav" onclick="show('saved',this)">🕘 Son kombinler</button>
</nav>
</div>

function locks(){return JSON.parse(localStorage.getItem(LOCK)||'{}')}
function available(c){let l=locks()[c.id];return !l||l<=Date.now()}
function lock(ids){let l=locks();ids.forEach(id=>l[id]=Date.now()+3*86400000);localStorage.setItem(LOCK,JSON.stringify(l))}
function pick(cat,used,weather,event){let arr=clothes.filter(c=>available(c)&&!used.has(c.id)&&c.cat===cat); if(weather==='coldrain'||weather==='cold')arr=arr.filter(c=>c.warm>=2); if(weather==='rain')arr=arr.filter(c=>c.cat!=='Spor ayakkabı'&&c.cat!=='Ayakkabı'); if(event==='wedding'||event==='night')arr.sort((a,b)=>(b.type==='dress')-(a.type==='dress')); return arr[0]}
function makeCombos(){
 const weather=document.getElementById('weather').value,event=document.getElementById('event').value,dress=document.getElementById('dress').checked||(event==='wedding'||event==='night');
 const out=[]; const patterns=[
  ['Gömlek','Pantolon','Ceket','Bot'],['Bluz','Pantolon','Ceket','Ayakkabı'],['Tişört','Pantolon','Ceket','Ayakkabı'],['Elbise','Bot'],['Elbise','Ayakkabı']
 ];
 for(let n=0;n<patterns.length;n++){let used=new Set(),items=[];
  for(const cat of patterns[n]){let c=pick(cat,used,weather,event);if(c){used.add(c.id);items.push(c)}}
  if(dress&&event==='wedding'&&n<3){let d=pick('Elbise',used,weather,event);if(d)items=[d, ...items.filter(x=>x.cat==='Bot'||x.cat==='Ayakkabı')]}
  if(items.length>=2)out.push({id:Date.now()+n,items,event,weather,created:new Date().toLocaleString('tr-TR')});
 }
 const unique=out.filter((x,i,a)=>!a.slice(0,i).some(y=>y.items.map(z=>z.id).join(',')===x.items.map(z=>z.id).join(','))).slice(0,5);
 document.getElementById('results').innerHTML=unique.length?unique.map((c,i)=>'<div class="combo"><h3>✨ Kombin '+(i+1)+' <span class="tag">'+(c.event==='wedding'?'Özel etkinlik':c.event==='night'?'Gece':'Günlük')+'</span></h3>'+c.items.map(x=>'<div class="item"><span>'+x.cat+'</span><b>'+x.name+'</b></div>').join('')+'<div class="actions"><button class="primary" onclick="saveCombo('+JSON.stringify(c).replace(/"/g,'&quot;')+')">Bu kombini kullan</button></div></div>').join(''):'<div class="card empty">Uygun ve kilitli olmayan yeterli parça bulunamadı.</div>';
}
function saveCombo(c){lock(c.items.map(x=>x.id));let s=JSON.parse(localStorage.getItem(KEY)||'[]');s.unshift(c);localStorage.setItem(KEY,JSON.stringify(s.slice(0,20)));alert('Kombin kaydedildi. Bu parçalar 3 gün kilitlendi.');renderSaved();makeCombos()}
function renderSaved(){let s=JSON.parse(localStorage.getItem(KEY)||'[]');document.getElementById('savedList').innerHTML=s.length?s.map((c,i)=>'<div class="combo"><b>Kombin '+(s.length-i)+'</b><div class="small">'+c.created+'</div>'+c.items.map(x=>'<div class="item"><span>'+x.cat+'</span><b>'+x.name+'</b></div>').join('')+'</div>').join(''):'<div class="empty">Henüz kaydedilmiş kombin yok.</div>'}
function renderWardrobe(){document.getElementById('wardrobeList').innerHTML='<div class="wardrobeGrid">'+clothes.map(c=>'<div class="wardrobeCard"><img loading="eager" src="'+c.img+'" alt="'+c.name+'" onerror="this.style.display=\"none\";this.nextElementSibling.classList.add(\"noimg\")"><div class="wardrobeInfo"><b>'+c.name+'</b><span>'+c.cat+'</span></div></div>').join('')+'</div>'}
function resetLocks(){localStorage.removeItem(LOCK);alert('3 günlük kilitler temizlendi.');makeCombos()}
function show(id,btn){['home','wardrobe','saved'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none');document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(id==='saved')renderSaved();if(id==='wardrobe')renderWardrobe()}
renderSaved();renderWardrobe();makeCombos();
</script>
